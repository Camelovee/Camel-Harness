name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.7"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: 安装 Python 依赖
        run: uv sync --locked --extra dev --python 3.11
      - name: 安装 WebUI 依赖
        run: npm ci --prefix webui
      - name: Python 检查
        run: |
          uv run --no-sync ruff check src tests evals scripts
          uv run --no-sync ruff format --check src tests evals scripts
          uv run --no-sync mypy src
          uv run --no-sync pytest -q
          uv run --no-sync lint-imports
          uv run --no-sync python -m evals.run
      - name: WebUI 构建
        run: npm run build --prefix webui
      - name: Python 发布包
        run: uv build
      - name: Diff 格式
        run: git diff --check HEAD^ HEAD
