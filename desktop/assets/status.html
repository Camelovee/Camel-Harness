<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'">
    <title>Camel Harness</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; }
      body { margin: 0; display: grid; place-items: center; height: 100vh; background: light-dark(#f6f5f3, #202020); color: light-dark(#262522, #eeede9); }
      main { width: min(420px, calc(100vw - 100px)); padding: 40px; border: 1px solid light-dark(#e5e3de, #3a3935); border-radius: 24px; background: light-dark(#ffffff, #242423); text-align: center; }
      img { display: block; width: 64px; height: 64px; margin: 0 auto 25px; }
      h1 { margin: 0 0 16px; font-size: 25px; font-weight: 600; letter-spacing: -.03em; }
      p { margin: 0; color: light-dark(#64615c, #c0bdb7); font-size: 14px; line-height: 1.85; }
      .status-spinner { display: block; width: 24px; height: 24px; margin: 24px auto 0; border: 2px solid light-dark(#e5e3de, #3a3935); border-top-color: light-dark(#805f47, #cfb292); border-radius: 50%; animation: spin 900ms linear infinite; }
      [data-state="failed"] .status-spinner { display: none; }
      button { margin-top: 24px; padding: 11px 22px; border: 0; border-radius: 9px; background: light-dark(#805f47, #cfb292); color: light-dark(#ffffff, #2b2118); font: inherit; font-size: 13px; cursor: pointer; }
      button:focus-visible { outline: 2px solid light-dark(#805f47, #cfb292); outline-offset: 4px; }
      button:disabled { cursor: wait; opacity: .5; }
      small { display: block; margin-top: 30px; color: light-dark(#64615c, #c0bdb7); font-size: 12px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .status-spinner { animation: none; } }
    </style>
    <script src="status.js" defer></script>
  </head>
  <body><main><img src="icon.svg" alt=""><h1>Camel Harness</h1><p id="message">正在准备你的本地工作空间…</p><span class="status-spinner" aria-hidden="true"></span><button id="retry" hidden>重新启动后端</button><small>你的项目，你的工作区。</small></main></body>
</html>
