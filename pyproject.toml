[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "camel-harness"
version = "1.0.1"
description = "轻量、可扩展的 Python Harness Agent"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.105,<1",
  "fastapi>=0.115,<1",
  "openai>=2.33,<3",
  "pydantic>=2.13,<3",
  "PyYAML>=6,<7",
  "jsonschema>=4.26,<5",
  "mcp>=1.0,<2",
  "portalocker>=4.2,<5",
  "pywin32>=308; sys_platform == 'win32'",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "types-PyYAML>=6,<7",
  "import-linter>=2.11,<3",
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.15,<1",
]

[project.scripts]
camel-harness-web = "camel_backend.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/camel_harness", "src/camel_backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.importlinter]
root_packages = ["camel_harness", "camel_backend"]

[[tool.importlinter.contracts]]
name = "LLM 不得依赖 Agent 或入口层"
type = "forbidden"
source_modules = ["camel_harness.llm"]
forbidden_modules = [
  "camel_harness.agent",
  "camel_backend",
]

[[tool.importlinter.contracts]]
name = "Agent 不得依赖入口层"
type = "forbidden"
source_modules = ["camel_harness.agent"]
forbidden_modules = [
  "camel_backend",
]

[[tool.importlinter.contracts]]
name = "Session 不得感知 Agent 运行事件或执行对象"
type = "forbidden"
source_modules = ["camel_harness.agent.session"]
forbidden_modules = ["camel_harness.agent.events", "camel_harness.agent.agent"]

[[tool.importlinter.contracts]]
name = "运行时组合不直接依赖可选工具 Provider"
type = "forbidden"
source_modules = ["camel_harness.agent.runtime"]
forbidden_modules = [
  "camel_harness.agent.tools.mcp",
  "camel_harness.agent.tools.memory_tools",
  "camel_harness.agent.tools.skill_loader",
  "camel_harness.agent.subagent.tool",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "上下文不得直接依赖会话存储实现"
type = "forbidden"
source_modules = ["camel_harness.agent.context"]
forbidden_modules = [
  "camel_harness.agent.session.jsonl",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "上下文不得依赖运行状态"
type = "forbidden"
source_modules = ["camel_harness.agent.context"]
forbidden_modules = ["camel_harness.agent.state"]

[[tool.importlinter.contracts]]
name = "Memory 内部分层：服务 -> 存储 -> 类型"
type = "layers"
containers = ["camel_harness.agent.memory"]
layers = [
  "memory_manager",
  "memory_store",
  "types",
]
exhaustive = true

[[tool.importlinter.contracts]]
name = "Memory 不得依赖编排、上下文、运行、工具或入口层"
type = "forbidden"
source_modules = ["camel_harness.agent.memory"]
forbidden_modules = [
  "camel_harness.agent.agent",
  "camel_harness.agent.context",
  "camel_harness.agent.runtime",
  "camel_harness.agent.tools",
  "camel_backend",
]

[[tool.importlinter.contracts]]
name = "上下文不得直接依赖记忆存储实现"
type = "forbidden"
source_modules = ["camel_harness.agent.context"]
forbidden_modules = ["camel_harness.agent.memory.memory_store"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "会话类型不依赖会话其他模块"
type = "layers"
containers = ["camel_harness.agent.session"]
layers = [
  "events:jsonl:manager:resume",
  "types",
]
exhaustive = true
