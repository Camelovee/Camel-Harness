[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "camel-harness"
version = "0.1.0"
description = "轻量、可扩展的 Python Harness Agent"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.105,<1",
  "fastapi>=0.115,<1",
  "openai>=2.33,<3",
  "pydantic>=2.13,<3",
  "PyYAML>=6,<7",
  "jsonschema>=4.26,<5",
  "mcp>=1.0,<2",
  "typer>=0.25,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "types-PyYAML>=6,<7",
  "import-linter>=2.11,<3",
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.15,<1",
]

[project.scripts]
camel-harness = "camel_cli.main:app"
camel-harness-web = "camel_backend.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/camel_harness", "src/camel_backend", "src/camel_cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.importlinter]
root_packages = ["camel_harness", "camel_backend", "camel_cli"]

[[tool.importlinter.contracts]]
name = "LLM 不得依赖 Agent 或入口层"
type = "forbidden"
source_modules = ["camel_harness.llm"]
forbidden_modules = [
  "camel_harness.agent",
  "camel_backend",
  "camel_cli",
]

[[tool.importlinter.contracts]]
name = "Agent 不得依赖入口层"
type = "forbidden"
source_modules = ["camel_harness.agent"]
forbidden_modules = [
  "camel_backend",
  "camel_cli",
]

[[tool.importlinter.contracts]]
name = "Session 不得感知 Agent 运行事件或执行对象"
type = "forbidden"
source_modules = ["camel_harness.agent.session"]
forbidden_modules = ["camel_harness.agent.events", "camel_harness.agent.agent"]

[[tool.importlinter.contracts]]
name = "入口之间不得互相依赖"
type = "independence"
modules = [
  "camel_backend",
  "camel_cli",
]
