[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "camel-harness"
version = "0.1.0"
description = "轻量、可扩展的 Python Harness Agent"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.105,<1",
  "fastapi>=0.115,<1",
  "openai>=2.33,<3",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.12,<3",
  "jsonschema>=4.26,<5",
  "mcp>=1.0,<2",
  "typer>=0.25,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "import-linter>=2.11,<3",
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.15,<1",
]

[project.scripts]
camel-harness = "backend.cli:app"
camel-harness-web = "backend.web:main"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.importlinter]
root_package = "backend"

[[tool.importlinter.contracts]]
name = "公共类型不得依赖运行功能"
type = "forbidden"
source_modules = ["backend.types"]
forbidden_modules = [
  "backend.agent",
  "backend.api",
  "backend.compaction",
  "backend.harness",
  "backend.llm",
  "backend.resources",
  "backend.runtime",
  "backend.session",
  "backend.tools",
]

[[tool.importlinter.contracts]]
name = "低层 Agent Loop 不得依赖 Harness 能力"
type = "forbidden"
source_modules = ["backend.agent.agent_loop"]
forbidden_modules = [
  "backend.api",
  "backend.compaction",
  "backend.harness",
  "backend.resources",
  "backend.runtime",
  "backend.session",
]

[[tool.importlinter.contracts]]
name = "运行功能不得依赖 HTTP API"
type = "forbidden"
source_modules = [
  "backend.agent",
  "backend.compaction",
  "backend.harness",
  "backend.llm",
  "backend.resources",
  "backend.session",
  "backend.tools",
  "backend.types",
]
forbidden_modules = [
  "backend.api",
]
