[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "camel-harness"
version = "0.1.0"
description = "轻量、可扩展的 Python Harness Agent"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.105,<1",
  "fastapi>=0.115,<1",
  "openai>=2.33,<3",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.12,<3",
  "jsonschema>=4.26,<5",
  "mcp>=1.0,<2",
  "typer>=0.25,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "import-linter>=2.11,<3",
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.15,<1",
]

[project.scripts]
camel-harness = "camel_harness.cli.main:app"
camel-harness-web = "camel_harness.backend.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/camel_harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.importlinter]
root_package = "camel_harness"

[[tool.importlinter.contracts]]
name = "公共类型不得依赖运行功能"
type = "forbidden"
source_modules = ["camel_harness.types"]
forbidden_modules = [
  "camel_harness.harness",
  "camel_harness.backend",
  "camel_harness.cli",
]

[[tool.importlinter.contracts]]
name = "低层 Agent Loop 不得依赖 Harness 能力"
type = "forbidden"
source_modules = ["camel_harness.agent_loop"]
forbidden_modules = [
  "camel_harness.harness",
  "camel_harness.backend",
  "camel_harness.cli",
]

[[tool.importlinter.contracts]]
name = "Agent 不得依赖应用层"
type = "forbidden"
source_modules = [
  "camel_harness.agent",
  "camel_harness.agent_loop",
  "camel_harness.events",
  "camel_harness.llm",
  "camel_harness.options",
  "camel_harness.run",
  "camel_harness.subagent",
  "camel_harness.tools",
  "camel_harness.types",
]
forbidden_modules = [
  "camel_harness.harness",
  "camel_harness.backend",
  "camel_harness.cli",
]

[[tool.importlinter.contracts]]
name = "Harness 不得依赖入口层"
type = "forbidden"
source_modules = [
  "camel_harness.harness",
]
forbidden_modules = [
  "camel_harness.backend",
  "camel_harness.cli",
]

[[tool.importlinter.contracts]]
name = "入口之间不得互相依赖"
type = "independence"
modules = [
  "camel_harness.backend",
  "camel_harness.cli",
]
